model_name_or_path: models/DeepSeek-V2-Lite-Chat
trust_remote_code: true
use_reentrant_gc: false
flash_attn: disabled
stage: sft
do_train: true
deepspeed: configs/deepspeed_zero3.json

finetuning_type: freeze
freeze_trainable_modules:
- mlp
freeze_trainable_layers: 27
freeze_expert_selection_file: experts/deepseek_experts_15pct.json
freeze_expert_layer_offset: 1

use_mesa: true
mesa_baseline_model: models/DeepSeek-V2-Lite-Chat
mesa_router_loss_weight: 1.0
mesa_safe_data_source: PKU-SafeRLHF
mesa_selected_ot_max_iter: 500
mesa_selected_ot_tolerance: 0.00001

dataset_dir: data
dataset: stair_all
template: deepseek
overwrite_cache: true
cutoff_len: 512
max_samples: 30000
preprocessing_num_workers: 16
dataloader_num_workers: 4
output_dir: outputs/deepseek_mesa
logging_steps: 100
save_steps: 500
max_steps: 500
plot_loss: false
overwrite_output_dir: false
save_only_model: true
report_to: none
run_name: deepseek_mesa
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 0.0001
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
disable_gradient_checkpointing: true
